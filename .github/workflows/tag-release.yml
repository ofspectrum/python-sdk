# Create a release tag after SDK changes land on main.
name: Tag SDK Release

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sdk-release-tagging
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up release tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create release tag or retry publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/tag_release.py
